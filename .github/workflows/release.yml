name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          echo "tag=${RAW}" >> "$GITHUB_OUTPUT"
          echo "ver=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          fi
          OUT_DIR="dist/request-anything_${{ steps.meta.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "${OUT_DIR}"
          go build -trimpath -ldflags "-s -w -X github.com/TaTrap/request-anything/internal/mcp.Version=${{ steps.meta.outputs.ver }}" -o "${OUT_DIR}/request-anything${EXT}" ./cmd/request-anything
          cp README.md README.vi.md LICENSE server.json "${OUT_DIR}/"
          mkdir -p artifacts
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd dist && zip -qr "../artifacts/request-anything_${{ steps.meta.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "request-anything_${{ steps.meta.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}")
          else
            tar -C dist -czf "artifacts/request-anything_${{ steps.meta.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "request-anything_${{ steps.meta.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd all-artifacts
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: all-artifacts/*
